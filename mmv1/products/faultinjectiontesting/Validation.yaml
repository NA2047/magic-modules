---
name: Validation
description: Description
base_url: projects/{{project}}/locations/{{location}}/validations
immutable: true
self_link: projects/{{project}}/locations/{{location}}/validations/{{validation_id}}
create_url: projects/{{project}}/locations/{{location}}/validations?validationId={{validation_id}}
import_format:
  - projects/{{project}}/locations/{{location}}/validations/{{validation_id}}
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
parameters:
  - name: location
    type: String
    required: true
    description: Resource ID segment making up resource `name`. It identifies the resource within its parent collection as described in https://google.aip.dev/122.
    immutable: true
    url_param_only: true
  - name: validationId
    type: String
    required: true
    description: |-
      The ID to use for the Validation, which will become the final
      component of the Validation's resource name. Optional. If omitted,
      the server will create a UUID.
      This value should be 4-63 characters, and valid characters
      are /a-z-/. Cannot start or end with a hyphen.
    immutable: true
    url_param_only: true
properties:
  - name: action
    type: NestedObject
    required: true
    description: The action to be performed by the experiment.
    properties:
      - name: cloudSqlFailover
        type: NestedObject
        description: |-
          CloudSQLFailover causes a Cloud SQL primary instance to fail over to another
          instance.
        properties:
          - name: instance
            type: String
            required: true
            description: |-
              The identifying name of the Cloud SQL instance to fail over.
              Formatted like projects/{project_id}/instances/{instance_id}
      - name: gceFailCompute
        type: NestedObject
        description: GCEFailCompute specifies which instances to fail.
        properties:
          - name: instance
            type: String
            description: |-
              Specify a single instance by name. Format:
              "projects/*/zones/*/instances/*".
          - name: location
            type: String
            description: Specify that an entire zone or region should be affected.
          - name: mig
            type: NestedObject
            description: |-
              Details specifying a Managed Instance Group (MIG) and optionally a zone
              within it.
            properties:
              - name: instanceGroup
                type: String
                required: true
                description: The managed instance group. Can be zonal or regional.
              - name: location
                type: String
                description: Optionally specify a zone location to further restrict a regional MIG.
          - name: secureTagValue
            type: String
            description: |-
              Specify a group of non-MIG (Managed Instance Group) instances by secure
              tag. See https://cloud.google.com/firewall/docs/tags-firewalls-overview
              for more details on tags. Format: "tagValues/[0-9]+"
      - name: gkeFailCompute
        type: NestedObject
        description: GKEFailCompute specifies infrastructure or workload to fail.
        properties:
          - name: cluster
            type: String
            required: true
            description: |-
              Options for selecting which GKE resources to fail.
              The GKE cluster resource name.
          - name: k8sNamespace
            type: Array
            description: Specify one or more Kubernetes namespaces.
            item_type:
              type: String
          - name: location
            type: String
            description: Specify a zone or region location.
      - name: l7LbHttpFault
        type: NestedObject
        description: Injection of HTTP faults into a layer 7 load balancer.
        properties:
          - name: abort
            type: NestedObject
            description: Artificially return a specific HTTP status code for a percentage of requests.
            properties:
              - name: percentage
                type: Integer
                required: true
                description: Percentage of requests to abort, in the range 0 to 100, inclusive.
              - name: statusCode
                type: Integer
                required: true
                description: HTTP status code to return. In the range 500 to 599, inclusive.
          - name: backendService
            type: String
            description: |-
              Optional identifying name of the backend service to inject faults into.
              Formatted like
              projects/{project}/regions/{region}/backendServices/{backendService} or
              projects/{project}/global/backendServices/{backendService}
              If not specified, all backend services connected to the forwarding_rule
              will be affected.
          - name: delay
            type: NestedObject
            description: Artificially delay HTTP responses for a percentage of requests.
            properties:
              - name: delay
                type: String
                required: true
                description: Delay duration.
              - name: percentage
                type: Integer
                required: true
                description: Percentage of requests to delay, in the range 0 to 100, inclusive.
          - name: forwardingRule
            type: String
            required: true
            description: |-
              The identifying name of the forwarding rule resource where the faults will
              be injected.
              Formatted like
              projects/{project}/regions/{region}/forwardingRules/{forwardingRule} or
              projects/{project}/global/forwardingRules/{forwardingRule}
  - name: createTime
    type: String
    description: Time the Validation was created.
    output: true
  - name: description
    type: String
    description: Optional user-provided description or notes. Min length 0, max length 2000.
  - name: displayName
    type: String
    description: Human-readable name of the Validation.
  - name: name
    type: String
    description: |-
      Identifier. The resource name of the Validation, of the form:
      projects/{project_id}/locations/{location}/validations/{validation}.
    output: true
  - name: state
    type: String
    description: |-
      Possible values:
      PREPARING
      PREPARED
      INJECTING
      INJECTED
      REVERTING
      COMPLETED
  - name: stopTime
    type: String
    description: |-
      Time the Validation finished.  Specifically when the Validation state
      becomes COMPLETED. The presence of this field can be used to
      determine if the Validation is done or not.
    output: true